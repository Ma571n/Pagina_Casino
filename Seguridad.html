<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil|Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            padding: 56px;
            background: #312e81;
        }

        .custom-navbar{
            color: white;
            background-color: #5b3fa3;
        }

        .navbar-brand {
            font-weight: 600;
        }

        footer {
            background-color: #f8f9fa;
            padding: 1.5rem 0;
            margin-top: 2rem;
        }

        .barra {
            margin-top: 100px;
        }

        .nav-links-custom .nav-link {
            padding: 0.5rem 1rem;
            /* espacio uniforme arriba/abajo y a los lados */
            margin-right: 0.5rem;
            /* separación entre enlaces */
            border-radius: 0.5rem;
            /* bordes redondeados en cada link */
            transition: background-color 0.2s ease;
        }

        /* Hover para dar mejor efecto */
        .nav-links-custom .nav-link:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .datos-centrales {
            margin-top: 20px;
        }

        .informacion-personal {
            background-color: #4440b4;
            margin-top: 20px;
            padding: 20px;
        }

        .contenido {
            background-color: #8a47be;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 10px;
        }

        .contenido.col {
            margin-bottom: 10px;
        }

        button.btn {
            display: block;
            margin: 0 auto;
        }

        form {
            color: white;
            /* afecta a labels y texto */
        }

        form input,
        form textarea,
        form select {
            color: white;
            background-color: #5b3fa3;
        }

        form input::placeholder {
            color: #ccc;
        }
    </style>
</head>

<body>
    <header id="menuPrincipal"></header>
    <main>
        <!-- barra de navegacion  -->
        <section id="barraInfo" class="barra-principal"></section>

        <!-- Seccion para mostrar la informacion -->
        <!-- Simplemente secciona en 2 columnas y 2 filas la pagina -->
        <section class="informacion-personal container rounded-3">
            <div class="contenido container rounded-3"> <!--Seccion superior-->
                <div class="row">
                    <div class="col">
                        <!-- Importante es el form que se ve, esta en cada una de las filas y columnas-->
                        <form>
                            <fieldset disabled>
                                <div class="mb-3">
                                    <label for="disabledTextInput" class="form-label">Contraseña anterior</label>
                                    <input type="text" id="disabledTextInput" class="form-control"
                                        placeholder="Disabled input">
                                </div>
                            </fieldset>
                        </form>
                    </div>
                    <div class="col">
                        <form>
                            <fieldset disabled>
                                <div class="mb-3">
                                    <label for="disabledTextInput" class="form-label">Nueva contraseña</label>
                                    <input type="text" id="disabledTextInput" class="form-control"
                                        placeholder="Disabled input">
                                </div>
                            </fieldset>
                        </form>
                    </div>
                </div>
            </div>
            <div class="contenido container rounded-3">
                <!--seccion central tiene lo mismo presente que el la seccion superior-->
                <div class="row">
                    <div class="col">
                        <form>
                            <fieldset disabled>
                                <div class="mb-3">
                                    <label for="disabledTextInput" class="form-label">Escriba de nuevo la
                                        contraseña</label>
                                    <input type="text" id="disabledTextInput" class="form-control"
                                        placeholder="Disabled input">
                                </div>
                            </fieldset>
                        </form>
                    </div>
                </div>
            </div>
            <div class="container">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
        </section>
    </main>
    <footer id="menuFooter"></footer>

    <!-- Scripts -->
    <script src="menu.js"></script>
    <script src="footer.js"></script>
    <script src="barraInformacion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
