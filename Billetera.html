<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil|Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: #312e81;
        }

        .custom-navbar {
            background-color: #5b3fa3;
        }

        .navbar-brand {
            color: white;
            font-weight: 600;
        }

        .footer {
            background: #4c2ca3;
            color: #dcd6ff;
            padding: 28px 0 110px;
            border-top: 1px solid rgba(255, 255, 255, .08);
            margin-top: 3rem;
        }

        .barra-principal {
            padding: 56px;
        }

        .nav-links-custom .nav-link {
            padding: 0.5rem 1rem;
            /* espacio uniforme arriba/abajo y a los lados */
            margin-right: 0.5rem;
            /* separación entre enlaces */
            border-radius: 0.5rem;
            /* bordes redondeados en cada link */
            transition: background-color 0.2s ease;
        }

        /* Hover para dar mejor efecto */
        .nav-links-custom .nav-link:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .datos-centrales {
            margin-top: 10px;
        }

        .informacion-billetera {
            background-color: #f8f9fa;
            margin-top: 20px;
            padding: 20px;
            border-radius: 20px;
        }

        .contenido {
            background-color: #8a47be;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 10px;
        }

        .contenido.col {
            margin-bottom: 10px;
        }

        button.btn {
            display: block;
            margin: 0 auto;
        }

        form {
            color: white;
            /* afecta a labels y texto */
        }

        form input,
        form textarea,
        form select {
            color: white;
            background-color: #5b3fa3;
        }

        form input::placeholder {
            color: #f8f9fa;
        }

        .table th,
        .table td{
            background-color: #f8f9fa; 
            border: none;
        }

        .table tbody tr {
            border-top: 1px solid black;
            border-bottom: 1px solid black;
        }

        .btn {
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 600;
            border: 1px solid black;
        }

        .saldo-actual {
            background-color: #312e81; 
            color: white;
            border-radius: 20px;
            padding: 15px;
        }

        .botones-billetera .btn {
            border-radius: 8px;
            font-weight: bold;
            margin-right: 8px;
        }

        .pie-pagina{
            background-color: #4c2ca3;
            color:#dcd6ff; 
            padding:28px 0 110px; 
            border-top:1px solid rgba(255,255,255,.08); 
            margin-top:3rem;
        }
    </style>
</head>

<body>
    <header id="menuPrincipal"></header>
    <main>
        <!-- barra de navegacion  -->
        <section id="barraInfo" class="barra-principal"></section>

       <section class="informacion-billetera col-md-8 mx-auto">
        <!-- Botones y saldo -->
        <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex gap-2">
            <button class="btn btn-light">Histórico de transacciones</button>
            <button class="btn btn-light">Cargar dinero</button>
            <button class="btn btn-light">Retirar dinero</button>
        </div>
            <div class="saldo-actual">Saldo actual $63.000</div>
        </div>

        <section class="informacion-billetera container rounded-3">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">Fecha </th>
                        <th scope="col">Monto + </th>
                        <th scope="col">Monto - </th>
                        <th scope="col">Total </th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">11/11/2025</th>
                        <td>+ $52.0000 (Ruleta)</td>
                        <td>—</td>
                        <td>$63.000</td>
                    </tr>
                    <tr>
                        <th scope="row">15/04 /2025</th>
                        <td>+ $5.000 (Webpay)</td>
                        <td>—</td>
                        <td>$11.000</td>
                    </tr>
                    <tr>
                        <th scope="row">11/11/2025</th>
                        <td>—</td>
                        <td>-$50.000</td>
                        <td> $6.000</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <footer class="text-center" id="menuFooter"></footer>

    <!-- Scripts -->
    <script src="menu.js"></script>
    <script src="footer.js"></script>
    <script src="barraInformacion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
