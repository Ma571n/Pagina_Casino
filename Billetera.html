<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil|Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            padding: 56px;
            background: #312e81;
        }

        .custom-navbar {
            background-color: #5b3fa3;
        }

        .navbar-brand {
            color: white;
            font-weight: 600;
        }

        footer {
            background-color: #f8f9fa;
            padding: 1.5rem 0;
            margin-top: 2rem;
        }

        .barra {
            margin-top: 100px;
        }

        .nav-links-custom .nav-link {
            padding: 0.5rem 1rem;
            /* espacio uniforme arriba/abajo y a los lados */
            margin-right: 0.5rem;
            /* separación entre enlaces */
            border-radius: 0.5rem;
            /* bordes redondeados en cada link */
            transition: background-color 0.2s ease;
        }

        /* Hover para dar mejor efecto */
        .nav-links-custom .nav-link:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .datos-centrales {
            margin-top: 10px;
        }

        .informacion-billetera {
            background-color: #4440b4;
            margin-top: 20px;
            padding: 20px;
        }

        .contenido {
            background-color: #8a47be;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 10px;
        }

        .contenido.col {
            margin-bottom: 10px;
        }

        button.btn {
            display: block;
            margin: 0 auto;
        }

        form {
            color: white;
            /* afecta a labels y texto */
        }

        form input,
        form textarea,
        form select {
            color: white;
            background-color: #5b3fa3;
        }

        form input::placeholder {
            color: #ccc;
        }

        .pie-pagina{
            background-color: #4c2ca3;
            color:#dcd6ff; 
            padding:28px 0 110px; 
            border-top:1px solid rgba(255,255,255,.08); 
            margin-top:3rem;
        }
    </style>
</head>

<body>
    <header id="menuPrincipal"></header>
    <main>
        <!-- barra de navegacion  -->
        <section id="barraInfo" class="barra-principal"></section>

        <section class="informacion-billetera container rounded-3">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">First</th>
                        <th scope="col">Last</th>
                        <th scope="col">Handle</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">1</th>
                        <td>Mark</td>
                        <td>Otto</td>
                        <td>@mdo</td>
                    </tr>
                    <tr>
                        <th scope="row">2</th>
                        <td>Jacob</td>
                        <td>Thornton</td>
                        <td>@fat</td>
                    </tr>
                    <tr>
                        <th scope="row">3</th>
                        <td>John</td>
                        <td>Doe</td>
                        <td>@social</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <footer id="menuFooter"></footer>

    <!-- Scripts -->
    <script src="menu.js"></script>
    <script src="footer.js"></script>
    <script src="barraInformacion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
