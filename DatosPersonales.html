<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil|Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: #312e81;
        }

        footer {
            background-color: #f8f9fa;
            padding: 1.5rem 0;
            margin-top: 2rem;
        }

        .barra {
            margin-top: 100px;
        }

        .nav-links-custom .nav-link {
            padding: 0.5rem 1rem;
            /* espacio uniforme arriba/abajo y a los lados */
            margin-right: 0.5rem;
            /* separación entre enlaces */
            border-radius: 0.5rem;
            /* bordes redondeados en cada link */
            transition: background-color 0.2s ease;
        }

        /* Hover para dar mejor efecto */
        .nav-links-custom .nav-link:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .datos-centrales{
            margin-top: 20px;
        }

        .informacion-personal{
            background-color: white;
            margin-top: 20px;
        }

        .contenido{
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <header id="menuPrincipal"></header>
    <main>
        <!-- barra de navegacion  -->
        <section class="barra-principal">
            <nav class="navbar navbar-expand-lg bg-body-tertiary rounded-3 shadow mx-3 my-3 px-3">
                <div class="container-fluid"> <!-- Para usar todo el ancho disponible -->
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                        aria-label="Toggle navigation"> <!-- Boton para sacar el menu (si se encoje la pantalla) -->
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                        <!-- La parte que se despliega del menu -->
                        <div class="navbar-nav nav-links-custom"> <!-- Ajusta los links en la barra -->
                            <a class="nav-link active" aria-current="page" href="datos-personales">Datos personales</a>
                            <a class="nav-link" href="#">Contacto</a>
                            <a class="nav-link" href="#">Seguridad</a>
                            <a class="nav-link" href="#">Billetera virtual</a>
                        </div>
                    </div>
                </div>
            </nav>
        </section>

        <!-- Seccion para mostrar la informacion -->
        <section class="informacion-personal container rounded-3">
            <div class="contenido container">
                <div class="row">
                    <div class="col">
                        <form> 
                            <fieldset disabled>
                                <div class="mb-3">
                                    <label for="disabledTextInput" class="form-label">Usuario</label>
                                    <input type="text" id="disabledTextInput" class="form-control"
                                        placeholder="Disabled input">
                                </div>
                            </fieldset>
                        </form>
                    </div>
                    <div class="col">
                        <form> 
                            <fieldset disabled>
                                <div class="mb-3">
                                    <label for="disabledTextInput" class="form-label">Nombre y apellido</label>
                                    <input type="text" id="disabledTextInput" class="form-control"
                                        placeholder="Disabled input">
                                </div>
                            </fieldset>
                        </form>
                    </div>
                </div>
            </div>
            <!--seccion central-->
            <div class="contenido container">
                <div class="row">
                    <div class="col">
                        <form> 
                            <fieldset disabled>
                                <div class="mb-3">
                                    <label for="disabledTextInput" class="form-label">Fecha de nacimiento</label>
                                    <input type="text" id="disabledTextInput" class="form-control"
                                        placeholder="Disabled input">
                                </div>
                            </fieldset>
                        </form>
                    </div>
                    <div class="col">
                        <form> 
                            <fieldset disabled>
                                <div class="mb-3">
                                    <label for="disabledTextInput" class="form-label">correo electronico</label>
                                    <input type="text" id="disabledTextInput" class="form-control"
                                        placeholder="Disabled input">
                                </div>
                            </fieldset>
                        </form>
                    </div>
                </div>
            </div>
            <div class="container">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
        </section>
    </main>
    <footer id="menuFooter"></footer>

    <!-- Scripts -->
    <script src="menu.js"></script>
    <script src="footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
