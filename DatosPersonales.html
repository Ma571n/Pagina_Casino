<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil|Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: #312e81;
        }

        .barra {
            margin-top: 100px;
        }

        .nav-links-custom .nav-link {
            padding: 0.5rem 1rem;
            /* espacio uniforme arriba/abajo y a los lados */
            margin-right: 0.5rem;
            /* separación entre enlaces */
            border-radius: 0.5rem;
            /* bordes redondeados en cada link */
            transition: background-color 0.2s ease;
        }

        /* Hover para dar mejor efecto */
        .nav-links-custom .nav-link:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
    <header id="menuPrincipal"></header>
    <main>
        <!-- barra de navegacion  -->
        <section class="barra-principal">
            <nav class="navbar navbar-expand-lg bg-body-tertiary rounded-3 shadow mx-3 my-3 px-3">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Navbar</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                        <div class="navbar-nav nav-links-custom">
                            <a class="nav-link active" aria-current="page" href="#">Datos personales</a>
                            <a class="nav-link" href="#">Contacto</a>
                            <a class="nav-link" href="#">Seguridad</a>
                            <a class="nav-link" href="#">Billetera virtual</a>
                        </div>
                    </div>
                </div>
            </nav>
        </section>
    </main>
    <footer id="menuFooter"></footer>

    <!-- Scripts -->
    <script src="menu.js"></script>
    <script src="footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
